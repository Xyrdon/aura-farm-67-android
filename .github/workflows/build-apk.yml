name: Build AURA FARM 67 APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download project from GitHub
        uses: actions/checkout@v4

      - name: Unpack project (for uploading one ZIP from your phone)
        shell: bash
        run: |
          if [ -f AURA67_ANDROID_PROJECT.zip ]; then
            unzip -oq AURA67_ANDROID_PROJECT.zip -d .
          fi
          test -f app/build.gradle
          test -f app/src/main/assets/index.html

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
project
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK for download
        uses: actions/upload-artifact@v4
        with:
          name: AURA_FARM_67_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
